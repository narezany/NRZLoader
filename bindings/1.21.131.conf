# Symbol names for the game build this loader targets.
#
# These are the defaults compiled into the loader. They are educated guesses
# based on how Bedrock's classes are normally named, NOT confirmed against a
# retail 1.21.131 binary. Confirm them before use:
#
#   python3 tools/symgen.py minecraft.apk --search Level::tick
#   python3 tools/symgen.py minecraft.apk -o out
#
# and copy the generated bindings.conf over this file.
#
# Format:  <event> = <mangled symbol>
#   or     <event> = sig:1F 20 03 D5 ?? ?? ?? 94
#
# A binding whose symbol does not resolve is skipped with a warning; the rest
# of the loader keeps working.

level.tick   = _ZN5Level4tickEv
actor.hurt   = _ZN5Actor4hurtERK16ActorDamageSourcefbb
player.join  = _ZN5Level9addPlayerEP6Player
player.leave = _ZN5Level12removePlayerEP6Player
