# Bindings for a retail 1.26.x Android arm64 build.
#
# Confirmed against the dynamic symbol table of a real 1.26.23.1 library:
# 89484 exported names, no .symtab, and not a single one of the game's own
# classes among them. Actor, BlockLegacy and ItemStack return zero matches.
#
# That rules out hooking gameplay functions by name on this build. What
# survives, fully named, is the embedded JavaScript engine, which is what the
# game's own scripting API runs on. The v8.* entries below are the way in.
#
# The native bindings are left here for builds that do export game symbols,
# such as the dedicated server. On a retail client they simply stay inactive
# and the loader says so in the log.

# --- script engine: confirmed present on 1.26.23.1 -------------------------

v8.context.new        = _ZN2v87Context3NewEPNS_7IsolateEPNS_22ExtensionConfigurationENS_10MaybeLocalINS_14ObjectTemplateEEENS5_INS_5ValueEEENS_33DeserializeInternalFieldsCallbackEPNS_14MicrotaskQueueE
v8.script.run         = _ZN2v86Script3RunENS_5LocalINS_7ContextEEE
v8.function.call      = _ZN2v88Function4CallENS_5LocalINS_7ContextEEENS1_INS_5ValueEEEiPS5_
v8.register.extension = _ZN2v817RegisterExtensionENSt6__ndk110unique_ptrINS_9ExtensionENS0_14default_deleteIS2_EEEE

# Also confirmed against 1.26.23.1. Together with the four above they are
# everything needed to compile and run a script inside the game.
v8.script.compile     = _ZN2v86Script7CompileENS_5LocalINS_7ContextEEENS1_INS_6StringEEEPNS_12ScriptOriginE
v8.string.new         = _ZN2v86String11NewFromUtf8EPNS_7IsolateEPKcNS_13NewStringTypeEi
v8.isolate.current    = _ZN2v87Isolate10GetCurrentEv
v8.context.global     = _ZN2v87Context6GlobalEv

# --- java side ------------------------------------------------------------
#
# Hooked only to borrow a JNIEnv from its first argument, which is what makes
# it possible to ask the user for all-files access. Confirmed present in the
# 1.26.23.1 export table.

jni.activity_init = Java_com_google_androidgamesdk_GameActivity_initializeNativeCode

# --- native game functions: absent from retail 1.26 ------------------------

level.tick   = _ZN5Level4tickEv
actor.hurt   = _ZN5Actor4hurtERK16ActorDamageSourcefbb
player.join  = _ZN5Level9addPlayerEP6Player
player.leave = _ZN5Level12removePlayerEP6Player
